frr version 8.2
frr defaults datacenter
hostname spine2
log syslog informational
no ipv6 forwarding

interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description to-leaf1
 ip address 10.0.0.4/31
!
interface eth2
 description to-leaf2
 ip address 10.0.0.6/31
!

router bgp 65101
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 neighbor leaf1 peer-group
 neighbor leaf1 remote-as 65001
 neighbor leaf1 bfd
 neighbor leaf1 description leaf1
 neighbor 10.0.0.5 peer-group leaf1
 !
 neighbor leaf2 peer-group
 neighbor leaf2 remote-as 65002
 neighbor leaf2 bfd
 neighbor leaf2 description leaf2
 neighbor 10.0.0.7 peer-group leaf2
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  neighbor leaf1 activate
  neighbor leaf1 soft-reconfiguration inbound
  neighbor leaf2 activate
  neighbor leaf2 soft-reconfiguration inbound
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor leaf1 activate
  neighbor leaf1 next-hop-unchanged
  neighbor leaf2 activate
  neighbor leaf2 next-hop-unchanged
 exit-address-family
!
